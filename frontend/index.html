<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KickOut 26 - Post-Match Escape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', 'sans-serif'],
          },
          colors: {
            brand: {
              neon: '#dcf836',    // Vibrant Neon Yellow/Green
              magenta: '#ff0055', // Vibrant Magenta
              cyan: '#00f0ff',    // Vibrant Cyan
              purple: '#4a00e0',  // Deep Purple
            },
            dark: {
              900: '#0a0014', // Very dark purple/black background
              800: '#1a0b2e', // Surface color
              700: '#2d1b4e', // Lighter surface
              600: '#432c7a', // Borders/Highlights
            }
          },
          animation: {
            'gradient-x': 'gradient-x 3s ease infinite',
          },
          keyframes: {
            'gradient-x': {
              '0%, 100%': {
                'background-size': '200% 200%',
                'background-position': 'left center'
              },
              '50%': {
                'background-size': '200% 200%',
                'background-position': 'right center'
              },
            }
          }
        }
      }
    }
  </script>
    <style>
    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #2d1b4e;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #432c7a;
    }
    body {
      background-color: #0a0014;
      color: #f8fafc;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
